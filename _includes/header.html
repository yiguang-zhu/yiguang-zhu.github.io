<header class="zc-header">
  <a class="zc-brand" href="{{ '/' | relative_url }}" aria-label="Yiguang Zhu — Home"><span>{{ site.data.profile.name }}</span><span class="zc-cn-name" lang="zh-CN">{{ site.data.profile.chinese_name }}</span></a>
  <nav class="zc-nav" aria-label="Main navigation">
    {% for item in site.data.navigation.main %}
    <a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
