      <a href="{{ site.data.profile.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="Yiguang Zhu on LinkedIn"><span class="zc-social-icon zc-icon-linkedin" aria-hidden="true"></span></a>
      <a href="{{ site.data.profile.instagram }}" target="_blank" rel="noopener noreferrer" aria-label="Yiguang Zhu on Instagram"><span class="zc-social-icon zc-icon-instagram" aria-hidden="true"></span></a>
