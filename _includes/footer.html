<footer class="zc-footer">
  <div class="zc-footer-main">
    <p class="zc-signature" lang="zh-CN">{{ site.data.profile.signature }}</p>
    <div class="zc-footer-contact">
      <a href="mailto:{{ site.data.profile.email }}">Email <span aria-hidden="true">↗</span></a>
      <a href="{{ site.data.profile.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
    </div>
  </div>
  <div class="zc-footer-bottom"><span>© {{ site.time | date: '%Y' }} {{ site.data.profile.name }}</span><span lang="zh-CN">{{ site.data.profile.chinese_name }}</span></div>
</footer>
