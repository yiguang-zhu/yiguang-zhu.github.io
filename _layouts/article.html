---
layout: default
---
<a class="zc-text-action zc-back" href="{{ '/random/' | relative_url }}">← Random</a>
<article class="zc-article">
  <p class="zc-eyebrow"><span lang="zh-CN">{{ page.category }}</span> · <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y.%m.%d' }}</time></p>
  <h1 lang="zh-CN">{{ page.title | escape }}</h1>
  {% if page.subtitle %}<p class="zc-article-subtitle">{{ page.subtitle | escape }}</p>{% endif %}
  <div class="zc-article-body">{{ content }}</div>
  <div class="zc-article-end"><a class="zc-text-action" href="{{ '/random/' | relative_url }}">← All Random</a></div>
</article>
